server:
  port: ${PORT:8080}
  error:
    include-message: never
spring:
  application:
    name: astra-defect-tracker
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/defect_tracker}
    username: ${DB_USER:tracker}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
app:
  bootstrap:
    admin-username: ${BOOTSTRAP_ADMIN_USERNAME:}
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
