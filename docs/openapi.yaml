openapi: 3.1.1
info:
  title: Astra Defect Tracker API
  version: 1.0.0
  description: REST API учебного трекера дефектов игрового проекта.
servers:
  - url: /api
security:
  - basicAuth: []
paths:
  /health:
    get:
      security: []
      summary: Состояние приложения
      responses:
        '200':
          description: Сервис доступен
  /auth/register:
    post:
      security: []
      summary: Регистрация заявителя
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Пользователь зарегистрирован
        '409':
          description: Имя пользователя уже занято
  /me:
    get:
      summary: Текущий пользователь
      responses:
        '200':
          description: Профиль пользователя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
  /projects:
    get:
      summary: Список проектов
      responses:
        '200':
          description: Проекты
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
    post:
      summary: Создать проект
      description: Требуется роль ADMIN.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
      responses:
        '201':
          description: Проект создан
        '403':
          description: Недостаточно прав
  /projects/{projectId}/issues:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Список дефектов проекта
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [NEW, TRIAGED, IN_PROGRESS, READY_FOR_TEST, VERIFIED, CLOSED, REOPENED] }
        - name: priority
          in: query
          schema: { type: string, enum: [LOW, NORMAL, HIGH, URGENT] }
        - name: q
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Подходящие дефекты
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Issue'
    post:
      summary: Зарегистрировать дефект
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateIssueRequest'
      responses:
        '201':
          description: Дефект зарегистрирован
        '400':
          description: Ошибка проверки данных
  /issues/{issueId}:
    parameters:
      - name: issueId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      summary: Карточка дефекта
      responses:
        '200':
          description: Дефект
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Issue' }
        '404':
          description: Дефект не найден
  /issues/{issueId}/status:
    patch:
      summary: Сменить состояние
      description: Требуется роль ADMIN, DEVELOPER или TESTER. Сервер проверяет допустимость перехода.
      parameters:
        - name: issueId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [NEW, TRIAGED, IN_PROGRESS, READY_FOR_TEST, VERIFIED, CLOSED, REOPENED] }
      responses:
        '200': { description: Состояние изменено }
        '409': { description: Переход запрещён правилами жизненного цикла }
  /issues/{issueId}/assignee:
    patch:
      summary: Назначить исполнителя
      description: Требуется роль ADMIN или DEVELOPER.
      parameters:
        - name: issueId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username]
              properties:
                username: { type: string }
      responses:
        '200': { description: Исполнитель назначен }
  /issues/{issueId}/comments:
    parameters:
      - name: issueId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      summary: Список комментариев
      responses:
        '200': { description: Комментарии }
    post:
      summary: Добавить комментарий
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, maxLength: 5000 }
      responses:
        '201': { description: Комментарий создан }
  /issues/{issueId}/history:
    get:
      summary: История состояния
      parameters:
        - name: issueId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200': { description: История изменений }
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
  schemas:
    RegisterRequest:
      type: object
      required: [username, password, displayName]
      properties:
        username: { type: string, pattern: '^[A-Za-z0-9._-]{3,64}$' }
        password: { type: string, format: password, minLength: 12, maxLength: 128 }
        displayName: { type: string, maxLength: 120 }
    CreateProjectRequest:
      type: object
      required: [projectKey, name, gameTitle, description]
      properties:
        projectKey: { type: string, pattern: '^[A-Za-z][A-Za-z0-9]{1,11}$' }
        name: { type: string, maxLength: 120 }
        gameTitle: { type: string, maxLength: 120 }
        description: { type: string, maxLength: 2000 }
    CreateIssueRequest:
      type: object
      required: [title, description, reproductionSteps, expectedResult, actualResult, gameVersion, platform]
      properties:
        title: { type: string, maxLength: 180 }
        description: { type: string, maxLength: 8000 }
        reproductionSteps: { type: string, maxLength: 8000 }
        expectedResult: { type: string, maxLength: 4000 }
        actualResult: { type: string, maxLength: 4000 }
        gameVersion: { type: string, maxLength: 64 }
        platform: { type: string, maxLength: 64 }
        severity: { type: string, enum: [LOW, MEDIUM, HIGH, CRITICAL], default: MEDIUM }
        priority: { type: string, enum: [LOW, NORMAL, HIGH, URGENT], default: NORMAL }
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        displayName: { type: string }
        role: { type: string, enum: [ADMIN, DEVELOPER, TESTER, REPORTER] }
        createdAt: { type: string, format: date-time }
    Project:
      type: object
      properties:
        id: { type: string, format: uuid }
        projectKey: { type: string }
        name: { type: string }
        gameTitle: { type: string }
        description: { type: string }
        createdAt: { type: string, format: date-time }
    Issue:
      type: object
      properties:
        id: { type: integer, format: int64 }
        issueKey: { type: string, example: ASTRA-00001 }
        projectId: { type: string, format: uuid }
        title: { type: string }
        description: { type: string }
        reproductionSteps: { type: string }
        expectedResult: { type: string }
        actualResult: { type: string }
        gameVersion: { type: string }
        platform: { type: string }
        severity: { type: string, enum: [LOW, MEDIUM, HIGH, CRITICAL] }
        priority: { type: string, enum: [LOW, NORMAL, HIGH, URGENT] }
        status: { type: string, enum: [NEW, TRIAGED, IN_PROGRESS, READY_FOR_TEST, VERIFIED, CLOSED, REOPENED] }
        reporterUsername: { type: string }
        assigneeUsername: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
